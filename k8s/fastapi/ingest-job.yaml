apiVersion: batch/v1
kind: Job

metadata:
  name:      fastapi-ingest

  labels:
    app.kubernetes.io/name:       fastapi-ingest
    app.kubernetes.io/component:  backend
    app.kubernetes.io/managed-by: kubectl
    environment:                  production

spec:
  template:
    metadata:
      labels:
        app: fastapi-ingest

    spec:
      restartPolicy: Never
      containers:
        - name: ingest
          image: wodlldd/production-rag-system:latest
          imagePullPolicy: Always
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key:  GOOGLE_API_KEY
          volumeMounts:
            - name: rag-data
            - name: upload-files
              mountPath: /upload-files
              mountPath: /app/data
          command:
            - sh
            - -c
            - |
              python -c "\
from src.ingestion.loader import DocumentLoader; \
from src.ingestion.chunker import DocumentChunker; \
from src.embeddings.embedder import EmbeddingGenerator; \
from src.vectorstore.vector_store import VectorStoreManager; \
loader = DocumentLoader(data_path='data/raw/uploads'); \
docs = loader.load_documents(); \
print(f'Loaded {len(docs)} documents'); \
chunker = DocumentChunker(); \
chunks = chunker.split_documents(docs); \
print(f'Created {len(chunks)} chunks'); \
embedder = EmbeddingGenerator(); \
vs = VectorStoreManager(embedding_model=embedder.get_embedding_model()); \
index = vs.create_vector_store(chunks); \
vs.save_vector_store(index); \
print('Vector store created successfully')\
"
      volumes:
        - name: upload-files
          configMap:
            name: upload-files
        - name: rag-data
            - name: upload-files
              mountPath: /upload-files
          persistentVolumeClaim:
            claimName: rag-data-pvc