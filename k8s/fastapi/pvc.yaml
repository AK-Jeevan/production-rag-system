apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name:      rag-data-pvc

  labels:
    app.kubernetes.io/name:       rag-data-pvc
    app.kubernetes.io/component:  storage
    app.kubernetes.io/managed-by: kubectl
    environment:                  production

  annotations:
    description: "PersistentVolumeClaim for RAG data (documents, FAISS index, BM25, feedback)"
    owner:        "ml-platform-team"

spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
