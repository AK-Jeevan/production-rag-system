apiVersion: v1
kind: Service

metadata:
  name:      fastapi-service
  namespace: production-rag-system

  labels:
    app.kubernetes.io/name:       fastapi-service
    app.kubernetes.io/component:  backend
    app.kubernetes.io/managed-by: kubectl
    environment:                  production

  annotations:
    description: "ClusterIP service exposing the FastAPI RAG application internally"
    owner:        "ml-platform-team"

spec:
  selector:
    app: fastapi

  ports:
    - name:       http
      protocol:   TCP
      port:       80          # port other services use to reach this service
      targetPort: 8000        # port FastAPI listens on inside the container

  type: ClusterIP

  sessionAffinity: None       # stateless API — no sticky sessions needed