apiVersion: apps/v1
kind: Deployment

metadata:
  name:      fastapi
  namespace: production-rag-system
  labels:
    app.kubernetes.io/name:       fastapi
    app.kubernetes.io/component:  backend
    app.kubernetes.io/managed-by: kubectl
    environment:                  production

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fastapi

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1     # one extra pod allowed during update
      maxUnavailable: 0     # zero downtime — always keep 2 pods running

  template:
    metadata:
      labels:
        app:                          fastapi
        app.kubernetes.io/name:       fastapi
        app.kubernetes.io/component:  backend
        environment:                  production

    spec:
      containers:
        - name:             fastapi
          image:            wodlldd/production-rag-system:latest
          imagePullPolicy:  Always     # always pull from DockerHub on every deploy

          ports:
            - name:          http
              containerPort: 8000
              protocol:      TCP

          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key:  GOOGLE_API_KEY

          resources:
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds:       15
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds:       10
            failureThreshold:    3

      restartPolicy: Always