apiVersion: apps/v1
kind: Deployment

metadata:
  name:      grafana

  labels:
    app.kubernetes.io/name:       grafana
    app.kubernetes.io/component:  monitoring
    app.kubernetes.io/managed-by: kubectl
    environment:                  production

  annotations:
    description: "Grafana dashboard for visualizing RAG system metrics from Prometheus"
    owner:        "ml-platform-team"

spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0             # always keep 1 grafana instance running during updates

  template:
    metadata:
      labels:
        app:         grafana
        environment: production

    spec:
      containers:
        - name:  grafana
          image: grafana/grafana:11.0.0   # pinned version — never use latest in production

          ports:
            - name:          http
              containerPort: 3000
              protocol:      TCP

          env:
            - name:  GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key:  admin-user

            - name:  GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key:  admin-password

            - name:  GF_SERVER_ROOT_URL
              value: "http://grafana-service:3000"

            - name:  GF_ANALYTICS_REPORTING_ENABLED
              value: "false"                # disable telemetry reporting to Grafana Labs

          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds:       10
            failureThreshold:    3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds:       20
            failureThreshold:    3

          volumeMounts:
            - name:      grafana-storage
              mountPath: /var/lib/grafana   # persists dashboards and datasources

      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc