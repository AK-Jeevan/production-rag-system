apiVersion: apps/v1
kind: Deployment

metadata:
  name:      mlflow
  namespace: production-rag-system

  labels:
    app.kubernetes.io/name:       mlflow
    app.kubernetes.io/component:  tracking
    app.kubernetes.io/managed-by: kubectl
    environment:                  production

  annotations:
    description: "MLflow tracking server for RAG pipeline experiment logging"
    owner:        "ml-platform-team"

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow

  strategy:
    type: Recreate             # only 1 replica + SQLite — Recreate avoids two pods writing to same db

  template:
    metadata:
      labels:
        app:         mlflow
        environment: production

    spec:
      containers:
        - name:  mlflow
          image: ghcr.io/mlflow/mlflow:v2.13.0   # pinned image — python:3.11 + pip install on every restart is slow and unreliable

          command:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:///mlflow/mlflow.db
            - --default-artifact-root
            - /mlflow/mlruns
            - --host
            - "0.0.0.0"
            - --port
            - "5000"                                 # required — fixes EC2 IP host header rejection you hit before

          ports:
            - name:          http
              containerPort: 5000
              protocol:      TCP

          resources:
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "500m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds:       10
            failureThreshold:    3

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds:       20
            failureThreshold:    3

          volumeMounts:
            - name:      mlflow-storage
              mountPath: /mlflow              # mounts persistent volume for db + artifacts

      volumes:
        - name: mlflow-storage
          persistentVolumeClaim:
            claimName: mlflow-pvc            # defined in a separate pvc.yaml

---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name:      mlflow-pvc
  namespace: production-rag-system

  labels:
    app.kubernetes.io/name:       mlflow
    app.kubernetes.io/component:  tracking
    app.kubernetes.io/managed-by: kubectl

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi