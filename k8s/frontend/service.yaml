apiVersion: v1
kind: Service

metadata:
  name:      frontend-service
  namespace: production-rag-system

  labels:
    app.kubernetes.io/name:       frontend-service
    app.kubernetes.io/component:  frontend
    app.kubernetes.io/managed-by: kubectl
    environment:                  production

  annotations:
    description: "ClusterIP service exposing the Gradio frontend internally"
    owner:        "ml-platform-team"

spec:
  selector:
    app: frontend

  ports:
    - name:       http
      protocol:   TCP
      port:       80          # port other services use to reach this service
      targetPort: 7860        # port Gradio listens on inside the container

  type: ClusterIP

  sessionAffinity: None       # stateless — no sticky sessions needed