apiVersion: apps/v1
kind: Deployment

metadata:
  name:      frontend
  namespace: production-rag-system
  labels:
    app.kubernetes.io/name:       frontend
    app.kubernetes.io/component:  frontend
    app.kubernetes.io/managed-by: kubectl
    environment:                  production

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app:                          frontend
        app.kubernetes.io/name:       frontend
        app.kubernetes.io/component:  frontend
        environment:                  production

    spec:
      containers:
        - name:             frontend
          image:            wodlldd/production-rag-system-frontend:latest
          imagePullPolicy:  Always

          ports:
            - name:          http
              containerPort: 7860
              protocol:      TCP

          env:
            - name: BACKEND_URL
              value: "http://fastapi-service:80/api/v1/query"

          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 15
            periodSeconds:       15
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 10
            periodSeconds:       10
            failureThreshold:    3

      restartPolicy: Always