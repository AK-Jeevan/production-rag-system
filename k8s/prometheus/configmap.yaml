apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus-config
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
    environment: production

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    rule_files: []

    scrape_configs:
      - job_name: "rag-api"
        metrics_path: "/api/v1/metrics"
        scrape_interval: 15s
        static_configs:
          - targets:
              - "fastapi-service:80"
            labels:
              env: "development"
              service: "rag-api"

      - job_name: "prometheus"
        metrics_path: "/metrics"
        scrape_interval: 30s
        static_configs:
          - targets:
              - "localhost:9090"
            labels:
              env: "development"
              service: "prometheus"
