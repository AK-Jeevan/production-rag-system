apiVersion: v1
kind: Service

metadata:
  name:      prometheus-service
  namespace: production-rag-system

  labels:
    app.kubernetes.io/name:       prometheus-service
    app.kubernetes.io/component:  monitoring
    app.kubernetes.io/managed-by: kubectl
    environment:                  production

  annotations:
    description: "ClusterIP service exposing Prometheus monitoring server internally"
    owner:        "ml-platform-team"

spec:
  selector:
    app: prometheus

  ports:
    - name:       http
      protocol:   TCP
      port:       9090        # port other services use to reach Prometheus
      targetPort: 9090        # port Prometheus listens on inside the container

  type: ClusterIP

  sessionAffinity: None       # stateless monitoring server — no sticky sessions needed