name: RAG CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/production-rag-system
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Tests with Coverage
        run: |
          python -m pytest --tb=short --verbose \
            --cov=app \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check . --fix
          ruff format .

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/production-rag-system

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Build & Push Frontend Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}-frontend:${{ github.sha }} -f Dockerfile.frontend .
          docker push ${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}-frontend:${{ github.sha }} ${{ env.IMAGE_NAME }}-frontend:latest
          docker push ${{ env.IMAGE_NAME }}-frontend:latest
